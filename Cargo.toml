[workspace]
members = [".", "core", "document", "examples/*"]

[workspace.dependencies]
cosmic-text = "0.18"
iced = { version = "0.15.0-dev", features = ["advanced", "tokio"] }
iced_core = "0.15.0-dev"
iced_graphics = "0.15.0-dev"
iced_widget = "0.15.0-dev"
markright_core = { path = "core" }
markright_document = { path = "document" }
reqwest = { version = "0.12", features = ["rustls-tls"] }

[package]
name = "markright"
version = "0.1.0"
edition = "2024"

[dependencies]
iced_core.workspace = true
markright_core.workspace = true

[dev-dependencies]
iced.workspace = true
iced_graphics.workspace = true
markright_document.workspace = true
reqwest.workspace = true


[patch.crates-io]
# Using local iced checkout until commit ad6a03ef9 (heading field) lands on
# airstrike/iced#dev — blocked on a pre-existing cargo-audit failure in
# iced's dev branch (unrelated: rustls-webpki 0.102.8 from tungstenite example).
iced = { path = "/Users/andy/projects/iced" }
iced_core = { path = "/Users/andy/projects/iced/core" }
iced_graphics = { path = "/Users/andy/projects/iced/graphics" }
iced_widget = { path = "/Users/andy/projects/iced/widget" }
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
